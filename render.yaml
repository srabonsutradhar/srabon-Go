services:
  - type: web
    name: srabon-go-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: TTS_RPM_LIMIT
        value: "10"
      - key: TTS_TPM_LIMIT
        value: "10000"
      - key: TTS_RPD_LIMIT
        value: "0"
