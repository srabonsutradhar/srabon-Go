<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jagannath Salon – Online Booking & Live Serial Queue</title>
    <meta name="description" content="Book appointments online, check live daily serial queue position, receive 5-minute turn notifications, and confirm work completion at Jagannath gents parlour and salon." />
    <meta name="theme-color" content="#b45309" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Salon App" />
    <meta property="og:title" content="Jagannath Salon – Online Booking & Live Serial Queue" />
    <meta property="og:description" content="Direct Android app for Jagannath gents parlour and salon: live serial queue, online booking, and dual digital completion signatures." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jagannath Salon" />
    <link rel="manifest" href="/salon-manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/salon-apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/salon-icon.svg" />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              zinc: {
                50: '#fafafa',
                100: '#f4f4f5',
                200: '#e4e4e7',
                300: '#d4d4d8',
                400: '#a1a1aa',
                500: '#71717a',
                600: '#52525b',
                800: '#27272a',
                900: '#18181b',
                950: '#09090b'
              }
            },
            fontFamily: {
              sans: ['DM Sans', 'Noto Sans Bengali', 'Inter', 'sans-serif'],
              serif: ['Playfair Display', 'Noto Sans Bengali', 'serif'],
              display: ['DM Sans', 'Noto Sans Bengali', 'Inter', 'sans-serif']
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-down': 'slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1)'
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' }
              },
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' }
              },
              slideDown: {
                '0%': { transform: 'translateY(-100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' }
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
        font-size: 16.5px;
      }
      @media (min-width: 640px) {
        html {
          font-size: 17.5px;
        }
      }
      body {
        font-family: "DM Sans", "Noto Sans Bengali", sans-serif;
        background-color: #f4f6fb;
        color: #111827;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      .dark body {
        background-color: #070b14;
        color: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <div id="root" data-entry="salon"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
